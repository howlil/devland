        - agent runtime or orchestration
    acceptance:
      - event contract tests fail before schema and ingestion implementation exist
      - schema defines the v1 normalized event vocabulary and stable identity timestamp source and linkage fields
      - valid normalized events append to .devland/runtime/events.ndjson outside canonical state
