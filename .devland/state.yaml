    kind: bugfix
    status: done
    goal: Make the executable Devland runtime resolve reusable schemas policies profiles and workflows from the installed tool while reading canonical project state from the target repository.
    scope:
      allowed:
        - separate target project root from installed Devland core root
        - minimal target repository regression coverage
        - preserve existing validate and context command behavior
      excluded:
        - engineering event model
        - metrics engine
        - provider adapters
        - package distribution or registry work
        - repository mutation commands
    acceptance:
      - regression test fails before the fix because a minimal target repository does not contain Devland schemas
      - validate reads canonical project and state from the target working directory
      - schemas policies profiles and workflows resolve from the installed Devland package root
      - existing self-host CLI behavior remains green
      - full Devland test suite passes after the fix
