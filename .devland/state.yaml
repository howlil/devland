    kind: feature
    status: done
    goal: Provide deterministic repository initialization and behavioral-contract migration before any public distribution.
    scope:
      allowed:
        - safe devland init project-name command
        - deterministic legacy v0 to contract 1 migration
        - idempotent current-contract migration
