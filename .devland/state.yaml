  - id: devland-v1-iteration-10-event-integrity
    kind: feature
    status: done
    goal: Make normalized engineering evidence semantically usable and prevent non-production deployments from closing production cycle metrics.
    scope:
      allowed:
        - event-type-specific linkage requirements
        - real timestamp validation
        - validation of persisted NDJSON events before metrics consumption
        - explicit canonical production environment names
        - production-aware idea-to-production timing
        - environment-aware deployment and recovery correlation
      excluded:
        - provider adapter
        - durable telemetry service
        - analytics database or dashboard
        - hard-coded production environment naming
    acceptance:
      - event and flow integrity tests fail before the semantic requirements are implemented
      - deployment success without required work deployment and environment linkage is rejected
      - impossible timestamps are rejected even when their string shape matches the schema pattern
      - staging deployment success does not close idea-to-production
      - identical deployment IDs in different environments cannot cross-pair
      - the final full test suite passes
    artifacts:
      spec: docs/superpowers/specs/2026-08-25-devland-trust-hardening-design.md
      plan: docs/superpowers/plans/2026-08-25-devland-iteration-10-event-integrity.md
      evidence:
        - GitHub Actions run 32775496147 verified RED for event and production-flow integrity contracts
        - GitHub Actions run 32775652195 verified GREEN after the event schema timestamp and production-aware metric implementation
        - GitHub Actions run 32775724318 verified GREEN on the final documented PR head
    branch: feat/devland-v1-iteration-10-event-integrity
    pull_request: PR-15
  - id: devland-v1-iteration-9-contract-versioning
    kind: feature
    status: done
    goal: Separate Devland behavioral compatibility from document schema compatibility so repositories cannot silently receive incompatible engineering semantics.
    scope:
      allowed:
        - required devland.contract canonical project field
        - runtime supported-contract validation
        - package version 0.1.0
        - Node engine contract >=22
        - repository-wide canonical fixture migration to contract 1
      excluded:
        - schema v1 migration
        - package publication
        - migration CLI
        - registry or release automation
    acceptance:
      - compatibility tests fail before explicit contract metadata exists
      - missing behavioral contract is invalid
      - unsupported behavioral contract fails explicitly
      - current repository templates evals and fixtures pin contract 1
      - package and lockfile agree on version and Node engine
      - the final full test suite passes
    artifacts:
      spec: docs/superpowers/specs/2026-08-25-devland-trust-hardening-design.md
      plan: docs/superpowers/plans/2026-08-25-devland-iteration-9-contract-versioning.md
      evidence:
        - GitHub Actions run 32774705503 verified RED before behavioral contract and package compatibility metadata existed
        - GitHub Actions run 32775141183 verified GREEN after runtime schema package and all canonical fixtures were migrated
    branch: feat/devland-v1-iteration-9-contract-versioning
    pull_request: PR-14
  - id: devland-v1-iteration-8-doctor-confidence
    kind: feature
    status: done
    goal: Prevent executable doctor from making global health claims beyond the diagnostic evidence it actually evaluates.
    scope:
      allowed:
        - explicit global doctor status
        - per-category diagnostic coverage
        - all nine doctor categories represented in reports
        - present absent inaccessible repository probing
        - uncertainty propagation for unreadable evidence
      excluded:
        - implementation of all nine diagnostic categories
        - automatic canonical rewrite
        - LLM repository inference
        - provider-specific diagnostics
    acceptance:
      - doctor confidence tests fail while no-finding output still implies global health
      - unsupported diagnostic categories are reported as not_evaluated
      - missing files are distinguished from inaccessible evidence
      - findings remain actionable and evidence-backed
      - the final full test suite passes
    artifacts:
      spec: docs/superpowers/specs/2026-08-25-devland-trust-hardening-design.md
      plan: docs/superpowers/plans/2026-08-25-devland-iteration-8-doctor-confidence.md
      evidence:
        - GitHub Actions run 32774471699 verified RED for doctor coverage and probe semantics
        - GitHub Actions run 32774557279 verified GREEN after coverage-aware doctor reporting and tri-state probing
    branch: feat/devland-v1-iteration-8-doctor-confidence
    pull_request: PR-13
  - id: devland-v1-iteration-7-canonical-invariants
    kind: feature
    status: done
    goal: Enforce canonical domain invariants beyond JSON shape and prevent explicitly requested profiles from disappearing silently.
    scope:
      allowed:
        - semantic validation after AJV structural validation
        - globally unique work IDs across state buckets
        - bucket and status consistency
        - required resolution of explicit project profiles
        - optional inferred profile candidates
      excluded:
        - canonical schema format migration
        - automatic state rewrites
        - mandatory inferred profiles
        - new dependency
    acceptance:
      - semantic invariant tests fail before implementation
      - duplicate work IDs across buckets are invalid
      - work status contradictory to its bucket is invalid
      - missing explicit profile IDs cause context resolution failure
      - inferred unavailable profiles remain optional
      - the final full test suite passes
    artifacts:
