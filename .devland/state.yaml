  - id: devland-v1-iteration-11-governance
    kind: maintenance
    status: done
    goal: Align Devland repository governance and cross-platform verification with the trust guarantees the tool expects from target projects.
    scope:
      allowed:
        - Ubuntu Windows and macOS CI matrix on Node 22
        - private vulnerability reporting policy
        - CRLF-safe runtime and test frontmatter parsing
        - regression coverage for Windows newline behavior
        - explicit architectural backlog in GitHub issues
      excluded:
        - package publication
        - implicit software license selection
        - mandatory second human reviewer
        - branch protection claims without an available repository-settings mutation capability
        - dashboard database or orchestration scope
    acceptance:
      - governance contract tests fail before cross-platform CI and SECURITY.md exist
      - the same test suite passes on Ubuntu Windows and macOS
      - a Windows-only failure is diagnosed and fixed rather than excluded from CI
      - private vulnerability reporting and public disclosure boundaries are documented
      - remaining provider adaptive-context doctor-eval and distribution work is visible in GitHub issues
    artifacts:
      spec: docs/superpowers/specs/2026-08-25-devland-trust-hardening-design.md
      plan: docs/superpowers/plans/2026-08-25-devland-iteration-11-governance.md
      evidence:
        - GitHub Actions run 32775881396 verified RED before the cross-platform and security governance contract existed
        - GitHub Actions run 32775940246 exposed a real Windows CRLF frontmatter portability defect while Ubuntu and macOS passed
        - GitHub Actions run 32776377229 verified GREEN on Ubuntu Windows and macOS after newline-agnostic parsing was implemented
        - GitHub issues 17 through 21 record the remaining provider evidence adaptive context doctor evaluation and public distribution work
