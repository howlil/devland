      allowed:
        - devland flow CLI command
        - local engineering event log reading
        - idea-to-production cycle timing
        - review wait timing
        - CI feedback latency
        - deployment latency
        - failed deployment recovery timing
        - actionable stage bottleneck reporting
        - executable flow metric tests
      excluded:
        - provider adapters
        - automatic telemetry collection
        - DORA rate metrics
        - analytics database or dashboard
        - agent runtime or orchestration
    acceptance:
      - flow contract tests fail before the command and metrics engine exist
      - complete correlated event pairs produce deterministic duration samples
      - missing linkage is skipped instead of inferred
      - missing event log produces an empty report
