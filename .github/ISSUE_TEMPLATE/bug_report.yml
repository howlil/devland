name: Bug report
description: Report reproducible incorrect behavior in Devland
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide the smallest reproducible case and remove secrets or private repository content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest steps, fixture, or command sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Devland have done instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Devland version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node version, OS, and relevant runtime/tool details
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Logs or context that are safe to share publicly. Do not include credentials, secrets, or private repository content.
