name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify package archive
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          test -n "$(find dist -maxdepth 1 -name 'devland-*.tgz' -print -quit)"
