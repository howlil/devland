name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/devland-v0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture generated lockfile
        run: |
          echo '---PACKAGE-LOCK-BEGIN---'
          cat package-lock.json
          echo '---PACKAGE-LOCK-END---'
      - run: npm test
