name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Core test suite
        run: pnpm test -- --test-name-pattern='^(?!.*packed Devland|.*installed package resolves|.*pnpm package contains)'
      - name: Packed artifact contract
        run: node --test tests/core/packed-artifact.test.mjs
      - name: Installed artifact smoke
        run: node --test tests/core/installed-artifact-smoke.test.mjs
      - name: Installed executable resolution
        run: node --test tests/core/installed-executable-resolution.test.mjs
