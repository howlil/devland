name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Core test suite
        run: pnpm test -- --test-name-pattern='^(?!.*packed Devland installs|.*installed package resolves)'
      - name: Build package archive
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          test -n "$(find dist -maxdepth 1 -name 'devland-*.tgz' -print -quit)"
      - name: Prepare install consumer
        run: |
          mkdir -p "$RUNNER_TEMP/devland-consumer"
          printf '{"name":"devland-smoke-consumer","private":true}\n' > "$RUNNER_TEMP/devland-consumer/package.json"
      - name: Install package archive
        run: pnpm --dir "$RUNNER_TEMP/devland-consumer" add --ignore-scripts "file:$GITHUB_WORKSPACE/dist/devland-0.2.0.tgz"
      - name: Run installed init
        working-directory: ${{ runner.temp }}/devland-consumer
        run: pnpm exec devland init smoke-consumer
      - name: Run installed validate
        working-directory: ${{ runner.temp }}/devland-consumer
        run: pnpm exec devland validate
      - name: Run installed context
        working-directory: ${{ runner.temp }}/devland-consumer
        run: pnpm exec devland context develop-change
