name: MCP container

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yml
      - .dockerignore
      - adapters/openai/chatgpt-plugin/**
      - src/runtime.mjs
      - src/change.mjs
      - src/context-contract.mjs
      - src/verification.mjs
      - src/doctor.mjs
      - src/metrics.mjs
      - src/events.mjs
      - src/correlation.mjs
      - src/facts/repository.mjs
      - schemas/project.schema.json
      - schemas/state.schema.json
      - schemas/work.schema.json
      - schemas/context.schema.json
      - schemas/verification.schema.json
      - schemas/engineering-event.schema.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/mcp-container.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - compose.yml
      - .dockerignore
      - adapters/openai/chatgpt-plugin/**
      - src/runtime.mjs
      - src/change.mjs
      - src/context-contract.mjs
      - src/verification.mjs
      - src/doctor.mjs
      - src/metrics.mjs
      - src/events.mjs
      - src/correlation.mjs
      - src/facts/repository.mjs
      - schemas/project.schema.json
      - schemas/state.schema.json
      - schemas/work.schema.json
      - schemas/context.schema.json
      - schemas/verification.schema.json
      - schemas/engineering-event.schema.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/mcp-container.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/howlil/devland

jobs:
  smoke:
    name: build, smoke, and publish MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t devland-mcp:test .
      - name: Validate Compose deployment contract
        run: docker compose -f compose.yml config --quiet
      - name: Smoke HTTP and MCP contract
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:8787:8787 devland-mcp:test)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if [[ "$(curl -fsS http://127.0.0.1:8787/ 2>/dev/null || true)" == "Devland context plugin" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          node <<'NODE'
          const fs = require('node:fs');

          const endpoint = 'http://127.0.0.1:8787/mcp';
          const headers = {
            'content-type': 'application/json',
            'accept': 'application/json, text/event-stream',
            'mcp-protocol-version': '2025-03-26',
          };

          async function rpc(id, method, params = {}) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify({ jsonrpc: '2.0', id, method, params }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${method} returned ${response.status}: ${text}`);
            const body = JSON.parse(text);
            if (body.error) throw new Error(`${method} failed: ${JSON.stringify(body.error)}`);
            return body.result;
          }

          (async () => {
            const projectYaml = fs.readFileSync('.devland/project.yaml', 'utf8');
            const stateYaml = fs.readFileSync('.devland/state.yaml', 'utf8');

            const initialized = await rpc(1, 'initialize', {
              protocolVersion: '2025-03-26',
              capabilities: {},
              clientInfo: { name: 'devland-ci', version: '1.0.0' },
            });
            if (initialized?.serverInfo?.name !== 'devland-context') {
              throw new Error(`unexpected server info: ${JSON.stringify(initialized?.serverInfo)}`);
            }

            const listed = await rpc(2, 'tools/list');
            const toolNames = (listed?.tools ?? []).map((tool) => tool.name).sort();
            const expected = ['doctor', 'flow_report', 'resolve_context'];
            if (JSON.stringify(toolNames) !== JSON.stringify(expected)) {
              throw new Error(`unexpected tool registry: ${JSON.stringify(toolNames)}`);
            }

            const resolved = await rpc(3, 'tools/call', {
              name: 'resolve_context',
              arguments: {
                project_yaml: projectYaml,
                state_yaml: stateYaml,
                workflow: 'develop-change',
                change: {
                  signals: ['localized'],
                  verification: {
                    criticality: 'behavioral',
                    failure_modes: ['MCP drops verification selection'],
                    boundary: 'integration',
                    cost: 'moderate',
                  },
                },
              },
            });
            const context = resolved?.structuredContent?.context;
            if (!context || context.verification?.boundary !== 'integration' || context.verification?.diagnostics?.length !== 0) {
              throw new Error(`resolve_context parity failed: ${JSON.stringify(resolved)}`);
            }

            const flow = await rpc(4, 'tools/call', {
              name: 'flow_report',
              arguments: {
                project_yaml: projectYaml,
                state_yaml: stateYaml,
                events_ndjson: '',
              },
            });
            if (flow?.structuredContent?.report?.evidence_status !== 'empty') {
              throw new Error(`empty flow evidence was not preserved: ${JSON.stringify(flow)}`);
            }

            const doctor = await rpc(5, 'tools/call', {
              name: 'doctor',
              arguments: {
                project_yaml: projectYaml,
                state_yaml: stateYaml,
                repository_files: [
                  { path: 'package.json', content: fs.readFileSync('package.json', 'utf8') },
                  { path: 'src/runtime.mjs', content: fs.readFileSync('src/runtime.mjs', 'utf8') },
                ],
              },
            });
            if (!doctor?.structuredContent?.doctor?.status) {
              throw new Error(`doctor returned no structured result: ${JSON.stringify(doctor)}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          docker tag devland-mcp:test "$IMAGE:latest"
          docker tag devland-mcp:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
