name: MCP container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - adapters/openai/chatgpt-plugin/**
      - src/**
      - core/**
      - profiles/**
      - schemas/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/mcp-container.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - adapters/openai/chatgpt-plugin/**
      - src/**
      - core/**
      - profiles/**
      - schemas/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/mcp-container.yml

permissions:
  contents: read

jobs:
  smoke:
    name: build and smoke MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t devland-mcp:test .
      - name: Smoke HTTP and MCP contract
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:8787:8787 devland-mcp:test)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if [[ "$(curl -fsS http://127.0.0.1:8787/ 2>/dev/null || true)" == "Devland context plugin" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          node <<'NODE'
          const fs = require('node:fs');

          const endpoint = 'http://127.0.0.1:8787/mcp';
          const headers = {
            'content-type': 'application/json',
            'accept': 'application/json, text/event-stream',
            'mcp-protocol-version': '2025-03-26',
          };

          async function rpc(id, method, params = {}) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify({ jsonrpc: '2.0', id, method, params }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${method} returned ${response.status}: ${text}`);
            const body = JSON.parse(text);
            if (body.error) throw new Error(`${method} failed: ${JSON.stringify(body.error)}`);
            return body.result;
          }

          (async () => {
            const initialized = await rpc(1, 'initialize', {
              protocolVersion: '2025-03-26',
              capabilities: {},
              clientInfo: { name: 'devland-ci', version: '1.0.0' },
            });
            if (initialized?.serverInfo?.name !== 'devland-context') {
              throw new Error(`unexpected server info: ${JSON.stringify(initialized?.serverInfo)}`);
            }

            const listed = await rpc(2, 'tools/list');
            if (!listed?.tools?.some((tool) => tool.name === 'resolve_context')) {
              throw new Error('resolve_context was not exposed');
            }

            const called = await rpc(3, 'tools/call', {
              name: 'resolve_context',
              arguments: {
                project_yaml: fs.readFileSync('.devland/project.yaml', 'utf8'),
                state_yaml: fs.readFileSync('.devland/state.yaml', 'utf8'),
                workflow: 'develop-change',
              },
            });
            if (!called?.structuredContent?.context) {
              throw new Error(`resolve_context returned no structured context: ${JSON.stringify(called)}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
