name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Verify release branch matches package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          expected_branch="release/$tag"
          test "$GITHUB_REF_NAME" = "$expected_branch" || {
            echo "Release ref $GITHUB_REF_NAME does not match package version branch $expected_branch" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  artifact:
    name: verify downloadable artifact
    needs:
      - preflight
      - verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build package archive
        shell: bash
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
      - name: Install package archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/devland-consumer"
          printf '{"name":"devland-release-smoke","private":true}\n' > "$RUNNER_TEMP/devland-consumer/package.json"
          archive="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'devland-*.tgz' -print -quit)"
          test -n "$archive"
          pnpm --dir "$RUNNER_TEMP/devland-consumer" add --ignore-scripts "file:$archive"
      - name: Smoke installed CLI
        shell: bash
        working-directory: ${{ runner.temp }}/devland-consumer
        run: |
          pnpm exec devland init release-smoke
          pnpm exec devland validate
          pnpm exec devland context develop-change
      - uses: actions/upload-artifact@v4
        with:
          name: devland-package
          path: dist/*.tgz

  release:
    name: publish GitHub release
    needs:
      - preflight
      - verify
      - artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: devland-package
          path: dist
      - name: Create verified tag
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged_commit="$(git rev-list -n 1 "$TAG")"
            test "$tagged_commit" = "$GITHUB_SHA" || {
              echo "Existing tag $TAG points to $tagged_commit instead of $GITHUB_SHA" >&2
              exit 1
            }
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "Devland $TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
          else
            gh release create "$TAG" dist/*.tgz --verify-tag --generate-notes --title "$TAG"
          fi
