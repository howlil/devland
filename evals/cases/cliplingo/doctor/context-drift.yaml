seed: >-
  Ongoing implementation started from an older repository base. The target base later introduced canonical Devland context, while the implementation continued and the canonical work status no longer matched repository and pull-request evidence.
expected_category: stale work state
evidence:
  - the implementation branch point predates canonical Devland context on the current target base
  - the current target base contains canonical context absent at the earlier branch point
  - repository or pull-request evidence shows work progress beyond the recorded canonical status
recommended_correction: >-
  Reconcile the current target base context into the ongoing work before changing canonical state, preserve the implementation, refresh status from current evidence, and rerun required verification on the reconciled result.
must_not_do:
  - do not automatically write overlapping canonical context before reconciliation
  - do not silently choose a work status without checking current evidence
  - do not mark work complete without verifying the reconciled result and remaining acceptance evidence
