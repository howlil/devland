seed: >-
  A work item is marked done, but its referenced or available evidence does not demonstrate the verification gate required for the claimed completion state.
expected_category: missing verification evidence for claimed-done work
evidence:
  - work state records status done
  - required completion verification is absent stale or does not cover the candidate being claimed complete
recommended_correction: >-
  Run or obtain fresh relevant verification and record the evidence. If completion cannot yet be supported, move the work state back to verifying instead of preserving an unsupported done claim.
must_not_do:
  - do not fabricate a CI run test result or verification record
  - do not automatically keep status done when the required evidence is missing
